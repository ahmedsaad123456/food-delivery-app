spring:
  application:
    name: food_delivery_app

  datasource:
    url: jdbc:postgresql://localhost:5432/food_delivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  redis:
    host: localhost
    port: 6379

  jwt-secret-key: ${JWT_SECRET_KEY}

  data:
    mongodb:
      auto-index-creation: true


  messages:
    basename: messages
    fallback-to-system-locale: false


logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    org.springframework.security: TRACE

spring.data.web.pageable:
  default-page-size: 20
  max-page-size: 50

stripe:
  secret-key: ${STRIPE_SECRET_KEY}            # no default on purpose: the app must fail to start if it is missing
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}   # used on day 11, empty for now

app:
  payment:
    currency: egp                              # if Stripe rejects it, use usd for testing
    success-url: http://localhost:8080/payment/success?session_id={CHECKOUT_SESSION_ID}
    cancel-url: http://localhost:8080/payment/cancel
    reuse-window: 25m                          # reuse the same checkout session for 25 minutes, then create a new one

delivery:
  assignment-strategy: least-busy